include classpath("application.conf")

# "*" makes ElasticMQ build queue URLs from the incoming request's Host header
# rather than a fixed hostname. Without it the URLs are baked to one address and
# only work from one place: the backend container reaches this as `sqs`, a psql
# or awslocal on the laptop reaches it as `localhost`, and whichever one the
# config named would be the only one whose returned QueueUrl was usable.
node-address {
  protocol = http
  host = "*"
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Reject what real SQS rejects. The whole reason for running the SQS protocol
  # locally instead of a hand-rolled queue is that it says no in the same places.
  sqs-limits = strict
}

queues {

  # ---- runs: "look at this run" ------------------------------------------
  #
  # Standard, not FIFO. An advance carries only a run id and means "look at this
  # run", never "task 7 finished", so ordering is meaningless and a duplicate
  # costs one wasted query. What keeps two orchestrators from dispatching the
  # same task is the conditional claim on the task row — the row is the lock.
  #
  # This queue used to be FIFO, and the deduplication that came with it is why
  # it is not any more. Dedup ids were built from the event (run + task +
  # attempt), but a re-plan reuses task ids and resets attempts, so a replacement
  # task's completion produced an id byte-identical to one sent minutes earlier
  # and SQS dropped it inside the 5 minute window. The run then sat with every
  # task pending and nothing left to publish another advance. An id that is
  # unique in the present was being used where uniqueness across history was
  # required.
  runs {
    # An advance is a query, a few conditional updates and some publishes. If it
    # has not finished in 30s it is wedged, not slow.
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "runs-dlq"
      # A poison advance would otherwise redeliver against the same run forever.
      maxReceiveCount = 5
    }
  }

  "runs-dlq" { }

  # ---- tasks: one envelope, one worker ----------------------------------
  #
  # Standard, NOT FIFO. The frontier is dispatched precisely because those tasks
  # are independent; a FIFO group per run would serialise them again and undo
  # the parallelism the DAG exists to express. Ordering is irrelevant here — the
  # conditional claim on the task row is what keeps double delivery harmless.
  tasks {
    # Matches LocalDispatcher's task_timeout. An analyst executing generated
    # code in the sandbox is the long pole; anything under this and the message
    # reappears while the first worker is still legitimately working on it.
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "tasks-dlq"
      maxReceiveCount = 3
    }
  }

  "tasks-dlq" { }
}
